---
# tasks file for ansible-role-moosefs
# Configure your MooseFS cluster.

- name: Configure the main metalogger configuration
  template:
    src: mfsmetalogger.cfg.j2
    dest: /etc/mfs/mfsmetalogger.cfg
    owner: mfs
    group: mfs
    mode: '0644'
  when: "'chunkservers' in group_names"

- name: Configure the main chunkserver configuration
  template:
    src: mfschunkserver.cfg.j2
    dest: /etc/mfs/mfschunkserver.cfg
    owner: mfs
    group: mfs
    mode: '0644'
  when: "'chunkservers' in group_names"


- name: Get list of active mount points
  ansible.builtin.assert:
    that:
      - target_directory | length > 0
      - (target_directory | regex_replace('/+$', '')) not in
        ['', '/', '/boot', '/etc', '/home', '/usr', '/var']
    fail_msg: "Refusing to run against '{{ target_directory }}'"

- name: Gather mount facts only
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - mounts

- name: Confirm target exists
  ansible.builtin.stat:
    path: "{{ target_directory }}"
  register: target_stat
  failed_when: not target_stat.stat.exists or not target_stat.stat.isdir

- name: Find (and optionally delete) empty, non-mount-point directories
  ansible.builtin.command:
    argv: >-
      {{
        ['find', target_directory, '-xdev', '-mindepth', '1', '-depth',
         '-type', 'd', '-empty']
        + (ansible_facts.mounts | map(attribute='mount') | map('regex_replace', '^(.*)$', '-not -path \1') | map('split', ' ', 2) | flatten | list)
        + ['-print']
        + ([] if dry_run else ['-delete'])
      }}
  register: result
  changed_when: (not dry_run) and result.stdout_lines | length > 0
  check_mode: false   # command must run so the dry-run listing works

- name: Report directories
  ansible.builtin.debug:
    msg: "{{ 'Would remove' if dry_run else 'Removed' }}: {{ result.stdout_lines }}"

  

- name: Build a list of bricks
  find:
    paths: /mnt/
    patterns: "mfsbrick.*,mfsbrickpro.*"
    file_type: directory
  register: brick_list

- name: Configure the chunkserver brick list
  template:
    src: mfshdd.cfg.j2
    dest: /etc/mfs/mfshdd.cfg
    owner: mfs
    group: mfs
    mode: '0644'
  when: "'chunkservers' in group_names"

- name: Mark MooseFS as configured
  set_fact:
    moosefs_configured: true

