- name: Fix ownership inside bricks (batched, one job per brick, in parallel)
  ansible.builtin.command:
    argv:
      - nice
      - find
      - "{{ item.path }}"
      - -xdev
      - "("
      - "!"
      - -user
      - mfs
      - -o
      - "!"
      - -group
      - mfs
      - ")"
      - -exec
      - chown
      - -h
      - mfs:mfs
      - "{}"
      - "+"
  loop: "{{ brick_list.files }}"
  async: 604800        # 7 days max
  poll: 0
  register: chown_jobs
  changed_when: false

- name: Wait for all brick chowns to finish
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ chown_jobs.results | default([]) }}"
  when: item.ansible_job_id is defined
  register: chown_wait
  until: chown_wait.finished
  retries: 20000
  delay: 30
