---
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create directory for GPG keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download OpenTofu GPG key (main)
      ansible.builtin.get_url:
        url: https://opentofu.org
        dest: /etc/apt/keyrings/opentofu.gpg
        mode: '0644'

    - name: Download OpenTofu GPG key (repository)
      ansible.builtin.get_url:
        url: https://opentofu.org
        dest: /etc/apt/keyrings/opentofu-repo.gpg
        mode: '0644'

    - name: Add OpenTofu APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://opentofu.org any main"
        filename: opentofu
        state: present

    - name: Add OpenTofu Source APT repository
      ansible.builtin.apt_repository:
        repo: "deb-src [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://opentofu.org any main"
        filename: opentofu
        state: present

    - name: Install OpenTofu
      ansible.builtin.apt:
        name: tofu
        state: present
        update_cache: true
