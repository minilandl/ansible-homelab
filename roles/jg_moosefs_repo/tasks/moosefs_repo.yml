---

- name: Ensure keyrings directory exists (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"


- name: Download MooseFS GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://repository.moosefs.com/moosefs.key
    dest: /tmp/moosefs.key
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Dearmor MooseFS GPG key (Debian/Ubuntu)
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/moosefs.gpg /tmp/moosefs.key
    creates: /etc/apt/keyrings/moosefs.gpg
  when: ansible_os_family == "Debian"


- name: "Add MooseFS 4 Community Repository Trixie"
  ansible.builtin.deb822_repository:
    name: moosefs
    types: [deb]
    uris: "https://repository.moosefs.com/moosefs-4/apt/{{ ansible_distribution}}/{{ansible_distribution_release}}"
    signed_by: "/etc/apt/keyrings/moosefs.gpg"
    suites: ["{{ ansible_distribution_release}}"]
    components: [main]
    state: present
    enabled: yes
    when: ansible_distributrion_release == "trixie" 


- name: "Add MooseFS 4 Community Repository Bookworm"
  ansible.builtin.deb822_repository:
    name: moosefs
    types: [deb]
    uris: "https://repository.moosefs.com/moosefs-4/apt/{{ ansible_distribution}}/{{ansible_distribution_release | lower | lower}}"
    signed_by: "/etc/apt/keyrings/moosefs.gpg"
    suites: ["{{ ansible_distribution_release | lower}}"]
    components: [main]
    state: present
    enabled: yes
    when: ansible_distributrion_release == "bookworm"


- name: Update apt cache
  apt:
    update_cache: yes
