---
- hosts: chunkservers
  become: yes
  serial: 1 
  roles:
    - roles/jg_moosefs_chunkserver 
  vars:
    target_directory: "/mnt/"
    dry_run: false
    moosefs_master_host: mfsmaster.jaspergreenhill.com 
  tasks:
  - name: System details
    ansible.builtin.debug: msg="{{ item }}"
    with_items:
    - "{{ ansible_hostname }}"
    - "{{ ansible_mounts }}"
    - "{{ ansible_distribution_release }}"
